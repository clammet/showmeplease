name: Renovate

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        default: info
        options: [info, debug]

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  renovate:
    uses: yuzuyuzuyu/repo-automation/.github/workflows/renovate-runner.yml@53b68b13cd927cbc53d7deb41bc3f04ec99178dc # v1.0.20
    with:
      app-client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
      native-automerge: true
    secrets:
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      RENOVATE_GITHUB_LOOKUP_TOKEN: ${{ secrets.RENOVATE_GITHUB_LOOKUP_TOKEN }}
