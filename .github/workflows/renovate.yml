# Self-hosted Renovate: turns every upstream release (npm packages, base
# images, action digests, the deployed image digest, pnpm itself) into a PR.
# Minor/patch/digest PRs merge via GitHub auto-merge once CI is green (the
# "protect main" ruleset makes both CI checks required); majors and red PRs
# sit until a human deals with them.
#
# Authenticates as a GitHub App (repository secrets RENOVATE_APP_ID and
# RENOVATE_APP_PRIVATE_KEY; the app must be installed on this repo with
# contents, pull requests, issues, and workflows read/write plus checks and
# commit statuses read). An app token — not GITHUB_TOKEN — is required so
# Renovate's PRs trigger the CI workflow above.
name: Renovate

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        default: info
        options: [info, debug]

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

env:
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: 44.34.3

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Scoped to this repository only (no `owner` input).
      - name: Mint app installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
