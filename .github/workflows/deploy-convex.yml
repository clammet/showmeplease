name: Deploy Convex production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: convex-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Convex
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check required production configuration
        env:
          CONVEX_SELF_HOSTED_URL: ${{ secrets.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          test -n "$CONVEX_SELF_HOSTED_URL"
          test -n "$CONVEX_SELF_HOSTED_ADMIN_KEY"
          test -n "$AUTH_GOOGLE_ID"
          test -n "$AUTH_GOOGLE_SECRET"
          test -n "$SITE_URL"
          test -n "$ADMIN_EMAILS"

      # Installs the exact pnpm version pinned in package.json's
      # packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keep production untouched when the revision does not pass the same
      # application checks required by CI.
      - name: Lint
        run: pnpm lint

      - name: Build and test
        run: pnpm test

      - name: Set Convex production environment
        env:
          CONVEX_SELF_HOSTED_URL: ${{ secrets.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          pnpm exec convex env set AUTH_GOOGLE_ID "$AUTH_GOOGLE_ID"
          pnpm exec convex env set AUTH_GOOGLE_SECRET "$AUTH_GOOGLE_SECRET"
          pnpm exec convex env set SITE_URL "$SITE_URL"
          pnpm exec convex env set ADMIN_EMAILS "$ADMIN_EMAILS"

      - name: Deploy Convex functions
        env:
          CONVEX_SELF_HOSTED_URL: ${{ secrets.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
        run: pnpm exec convex deploy

      - name: Verify deployed functions
        env:
          CONVEX_SELF_HOSTED_URL: ${{ secrets.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
        run: pnpm exec convex run users:currentProfile '{}'
