---
name: Maintenance watchdog

on:
  schedule:
    - cron: "21 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write

concurrency:
  group: maintenance-watchdog
  cancel-in-progress: false


jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: yuzuyuzuyu/repo-automation/actions/watchdog@53b68b13cd927cbc53d7deb41bc3f04ec99178dc # v1.0.20
