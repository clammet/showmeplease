# Production deployment: one container serving the frontend and the small
# backend. Media flows browser <-> Cloudflare Realtime SFU directly.
#
#   cp ../.env.example .env   # fill in values
#   docker compose pull && docker compose up -d
#
# The image is pinned by digest; Renovate PRs a new digest whenever CI
# publishes a fresh image, so `git pull` here always deploys exactly what was
# built and tested. (For a local build instead, use `pnpm image:build`.)
#
# Convex (auth) is external: either convex.dev cloud or a self-hosted
# instance (https://github.com/get-convex/convex-backend/tree/main/self-hosted);
# point CONVEX_URL / CONVEX_SITE_URL at it and deploy the functions with
# `npx convex deploy`.

services:
  app:
    image: ghcr.io/clammet/showmeplease:latest@sha256:ec6faca90293d6395ee47d7a1e1747f897f8e7b4d07b4f33c932990d2c7c9865
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
