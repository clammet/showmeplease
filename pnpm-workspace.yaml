allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@clammet/convex-googly-auth@1.0.0'
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Legacy semver 6 patch from July 2023, required by Babel/ESLint. Its recorded
# integrity is unchanged; semver 7's provenance history triggers the check.
# https://github.com/npm/node-semver/releases/tag/v6.3.1
trustPolicyExclude:
  - 'semver@6.3.1'
trustPolicyExcludePrune: true
blockExoticSubdeps: true
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
saveExact: true
